# Training checkpoint and output directories
ckpt_dir: ./ckpts
default_root_dir: ./outputs
train_i2v: true

# Training hyperparameters
max_epochs: 1
batch_size: 4
steps_per_epoch: 300000
accumulate_grad_batches: 1
num_train_timesteps: 1000
lr: 1e-5
weight_decay: 0.0
warmup_steps: 300
train_cfg_prob: 0.0
ref_dropout_prob: 0.0
video_loss_weight: 0.85
save_top_k: 0
gradient_checkpoint: true
log_every_n_steps: 1

# Mixed training configuration
enable_mixed_training: false  
audio_only_loss_weight: 0.4  
max_audio_duration: 20.0

# LoRA parameters
train_lora: true
lora_rank: 128
lora_alpha: 128
lora_target_modules: "q,k,v,o,k_fusion, v_fusion"  # Target modules for LoRA adaptation (applied to audio_model and video_model)
lora_path: null                 # Path to existing LoRA weights to merge into base model
pretrain_lora_path: null        # Path to existing LoRA weights to continue training from

# Fine-tuning options (works in both LoRA and full fine-tuning modes)
train_fusion: true              # Train fusion layers directly (k_fusion, v_fusion, pre_attn_norm_fusion, norm_k_fusion)
train_audio: true              # Train audio_model (LoRA params in LoRA mode, all params in full fine-tuning mode)
train_video: true              # Train video_model (LoRA params in LoRA mode, all params in full fine-tuning mode)
train_ref_embedding: true       # Train ref_embedding (LoRA params in LoRA mode, all params in full fine-tuning mode)

# Model and training strategy
precision: bf16
training_strategy: deepspeed_stage_2
# [auto, deepspeed_stage_1, deepspeed_stage_2, deepspeed_stage_2_offload, deepspeed_stage_3, deepspeed_stage_3_offload, ddp]

# Memory optimization
text_encoder_cpu_offload: false  # Offload T5 text encoder to CPU when not in use to save GPU memory

# Data loading parameters
dataloader_num_workers: 8
pin_memory: true
num_aspect_buckets: 8
seed: 42

# Video and image parameters
num_frames: 81
frame_tolerance: 10
height: 960
width: 960
description_model: gemini2.5pro
model_name: 960x960_5s  # Options: 720x720_5s, 960x960_5s, 960x960_10s

# Prompt parameters
video_negative_prompt: ""
audio_negative_prompt: ""

# Solver parameters
shift: 5.0
solver_name: unipc

# Model guidance scales
audio_guidance_scale: 3.0
video_guidance_scale: 4.0

# EMA parameters
use_ema: false
auto_ema: false           # Automatically enable EMA at 50% of training
ema_decay: 0.999